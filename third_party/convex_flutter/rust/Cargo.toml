[package]
name = "convex_flutter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
tokio = { version = "1", features = ["full"] }
android_logger = { version = "0.14.1" }
log = { version = "0.4.21" }
convex = { version = "0.10", features = ["rustls-tls-webpki-roots"] }
anyhow = { version = "1.0.86" }
thiserror = { version = "1.0.61" }
tokio-stream = { features = [ "io-util", "sync" ], version = "0.1" }
once_cell = { version = "1.19.0" }
futures = { version = "0.3" }
parking_lot = { version = "0.12.3" }
# monkeyhub patch: dropped `async-once-cell`. The client is no longer a
# write-once cell — see MobileConvexClient::force_reconnect.
serde_json = { version = "1.0.120" }
serde = { version = "1.0", features = ["derive"] }
base64 = { version = "0.21" }
# monkeyhub patch: size. Cargo's default release profile links with no LTO,
# 16 codegen units and every symbol kept, which made this the fourth-largest
# framework in the iOS app. Same opt-level, so no speed is traded; unwinding
# stays on because flutter_rust_bridge turns a Rust panic into a Dart error.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
maplit = { version = "1" }
