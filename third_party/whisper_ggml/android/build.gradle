group 'com.devac.whisper_flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:8.4.2'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.devac.whisper_ggml"
    // MONKEYHUB PATCH 8: the app's NDK (flutter.ndkVersion); 29 is not
    // installed here and AGP would download it on the first build.
    ndkVersion "28.2.13676358"

    compileSdk 36

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        cmake {
            path "src/whisper/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 24
        // MONKEYHUB PATCH 1: ffmpeg-kit is gone; the consumer rules are
        // trimmed accordingly but kept for the JNI keep rule.
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            // MONKEYHUB PATCH 8: no 32-bit x86. Flutter ships no x86 engine,
            // so that slice was dead weight in every APK/AAB.
            abiFilters("armeabi-v7a", "x86_64", "arm64-v8a")
        }
        externalNativeBuild {
            cmake {
                // No thin-LTO: with the full whisper.cpp v1.9.1 source tree
                // it multiplies link time for no meaningful size win.
                cFlags "-O3 -ffunction-sections -fdata-sections"
                cppFlags "-O3 -ffunction-sections -fdata-sections"
                arguments "-DANDROID_STL=c++_static", "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }
}
