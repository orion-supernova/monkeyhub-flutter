<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MonkeyHub — rooms, friends, secrets that fade.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MonkeyHub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MonkeyHub</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Web Push (RFC 8030), spoken directly to the browser's own push service.
    Delivers message and call notifications to a backgrounded, frozen or closed
    tab — the only channel that reaches a tab whose WebSocket the browser has
    suspended. No SDK: the backend encrypts each payload itself
    (backend/convex/webPush.ts) and web/mh-push-sw.js renders it.

    Web Push requires a secure origin, so none of this works on plain localhost.
  -->
  <script>
    // Thin bridge the Flutter app calls via JS-interop (lib/push/web_push_web.dart).
    (function () {
      var SW_URL = '/web/mh-push-sw.js';
      // Narrower than the worker's own directory on purpose: a worker may claim
      // any scope at or below /web/, and taking a sub-path means we can never
      // collide with a service worker `flutter build web` ships at /web/.
      // Push delivery does not care that no page lives here.
      var SW_SCOPE = '/web/push/';
      var _registration = null;

      function ready() {
        if (_registration) return Promise.resolve(_registration);
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
          return Promise.resolve(null);
        }
        return navigator.serviceWorker
          .register(SW_URL, { scope: SW_SCOPE })
          .then(function (reg) {
            _registration = reg;
            return reg;
          })
          .catch(function () { return null; });
      }

      // The VAPID public key travels as base64url but subscribe() wants raw
      // bytes.
      function urlBase64ToUint8Array(base64) {
        var padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
        var raw = atob(padded.replace(/-/g, '+').replace(/_/g, '/'));
        var out = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
        return out;
      }

      function b64(buf) {
        var bytes = new Uint8Array(buf);
        var s = '';
        for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
        return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
      }

      // Returns {endpoint, p256dh, auth} or null. Idempotent — subscribe()
      // hands back the existing subscription when the key matches.
      window.mhPushSubscribe = function (vapidPublicKey) {
        // Subscribing before permission is granted throws; asking here would
        // be ignored anyway, because a prompt needs a user gesture (see
        // mhPushPermission, called from App._primeAlerts).
        if (typeof Notification === 'undefined') return Promise.resolve(null);
        if (Notification.permission !== 'granted') return Promise.resolve(null);
        return ready().then(function (reg) {
          if (!reg) return null;
          return reg.pushManager
            .subscribe({
              // Chrome requires this, and it is the reason the backend never
              // sends a silent push to web.
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(vapidPublicKey),
            })
            .then(function (sub) {
              if (!sub) return null;
              return {
                endpoint: sub.endpoint,
                p256dh: b64(sub.getKey('p256dh')),
                auth: b64(sub.getKey('auth')),
              };
            })
            .catch(function () { return null; });
        });
      };

      window.mhPushPermission = function () {
        if (typeof Notification === 'undefined') return;
        try { Notification.requestPermission(); } catch (e) {}
      };

      window.mhPushOnOpenRoom = function (cb) {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.addEventListener('message', function (event) {
          try {
            var d = event.data || {};
            if (d.mh === 'openRoom') cb(d.roomId ? String(d.roomId) : '');
          } catch (e) {}
        });
      };

      // Friend activity — a highlight, a point, or a shared game result. A
      // second listener rather than a wider `mhPushOnOpenRoom`, because these
      // taps open the Feed and not a room, and folding them into a callback
      // whose one argument is a room id is how an empty string ends up
      // standing for two different destinations.
      window.mhPushOnOpenTarget = function (cb) {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.addEventListener('message', function (event) {
          try {
            var d = event.data || {};
            if (d.mh === 'openTarget') {
              cb(String(d.kind || ''), d.momentId ? String(d.momentId) : '');
            }
          } catch (e) {}
        });
      };

      // The previous vendor's service worker outlives its script tag, and it
      // keeps a live push subscription. Left alone it could still deliver, or
      // double up with ours.
      window.mhPushUnregisterLegacy = function () {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) {
            var w = r.active || r.installing || r.waiting;
            var url = (w && w.scriptURL) || '';
            if (url.indexOf('OneSignalSDKWorker') !== -1) r.unregister();
          });
        }).catch(function () {});
      };
    })();
  </script>

  <!--
    Opaque black host backdrop. Flutter-web composites platform views
    (flutter_webrtc's RTCVideoView / HtmlElementView) by punching a transparent
    hole through the Flutter canvas; without a background here the page behind
    shows through during video calls. Black matches the (opaque) call screens
    and native, so any such hole reveals black instead of the page. Normal
    (non-call) UI paints opaquely over this, so it's never otherwise seen.
  -->
  <!-- Opaque backdrop matching the app's dark theme -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0d0f12;
    }
    @keyframes mhPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes mhSpin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Instant HTML/CSS splash screen — visible immediately while JS/Wasm bundles download -->
  <div id="app-splash" style="position: fixed; inset: 0; z-index: 999999; background: #0d0f12; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; transition: opacity 0.3s ease-out;">
    <div style="width: 60px; height: 60px; background: #00e5ff; border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(0,229,255,0.25); animation: mhPulse 1.8s infinite ease-in-out;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0d0f12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </div>
    <div style="margin-top: 18px; font-size: 13px; font-weight: 700; letter-spacing: 4px; color: #f0f4f8;">MONKEYHUB</div>
    <div style="margin-top: 24px; width: 24px; height: 24px; border: 2.5px solid rgba(255,255,255,0.12); border-top-color: #00e5ff; border-radius: 50%; animation: mhSpin 0.8s linear infinite;"></div>
  </div>

  <script>
    (function() {
      function hideSplash() {
        var s = document.getElementById('app-splash');
        if (s && s.style.opacity !== '0') {
          s.style.opacity = '0';
          setTimeout(function() { if (s && s.parentNode) s.parentNode.removeChild(s); }, 350);
        }
      }
      window.addEventListener('flutter-first-frame', hideSplash);
      // Fallback timer in case event is fired before listener attaches
      setTimeout(hideSplash, 4000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
