<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MonkeyHub — rooms, friends, secrets that fade.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MonkeyHub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MonkeyHub</title>
  <link rel="manifest" href="manifest.json">

  <!--
    OneSignal Web Push. Delivers incoming-message (and web-only-callee call)
    notifications to a backgrounded/frozen/closed tab — the only channel that
    reaches a tab whose WebSocket the browser has frozen. The web subscription
    is tagged with external_id = userId (via OneSignal.login in the app), which
    is exactly what the Convex backend already targets, so no backend change is
    needed. Service worker lives at web/OneSignalSDKWorker.js (served at root).
  -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "c191a9f0-15cf-402a-8a04-dcc16108f4b0",
        // Web Push only works on the deployed HTTPS origin, never localhost.
        allowLocalhostAsSecureOrigin: false,
      });
    });

    // Thin bridge the Flutter app calls via JS-interop (lib/push/onesignal_web_web.dart).
    // Everything defers through OneSignalDeferred so it's safe to call before the SDK loads.
    window.mhOneSignalLogin = function (userId) {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(function (OneSignal) { OneSignal.login(userId); });
    };
    window.mhOneSignalLogout = function () {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(function (OneSignal) { OneSignal.logout(); });
    };
    window.mhOneSignalPrompt = function () {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(function (OneSignal) { OneSignal.Notifications.requestPermission(); });
    };
    window.mhOneSignalOnClick = function (cb) {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(function (OneSignal) {
        OneSignal.Notifications.addEventListener('click', function (event) {
          try {
            var d = (event && event.notification && event.notification.additionalData) || {};
            cb(d.roomId ? String(d.roomId) : '', d.type ? String(d.type) : '');
          } catch (e) {}
        });
      });
    };
  </script>

  <!--
    Opaque black host backdrop. Flutter-web composites platform views
    (flutter_webrtc's RTCVideoView / HtmlElementView) by punching a transparent
    hole through the Flutter canvas; without a background here the page behind
    shows through during video calls. Black matches the (opaque) call screens
    and native, so any such hole reveals black instead of the page. Normal
    (non-call) UI paints opaquely over this, so it's never otherwise seen.
  -->
  <!-- Opaque backdrop matching the app's dark theme -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0d0f12;
    }
    @keyframes mhPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes mhSpin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Instant HTML/CSS splash screen — visible immediately while JS/Wasm bundles download -->
  <div id="app-splash" style="position: fixed; inset: 0; z-index: 999999; background: #0d0f12; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; transition: opacity 0.3s ease-out;">
    <div style="width: 60px; height: 60px; background: #00e5ff; border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(0,229,255,0.25); animation: mhPulse 1.8s infinite ease-in-out;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0d0f12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </div>
    <div style="margin-top: 18px; font-size: 13px; font-weight: 700; letter-spacing: 4px; color: #f0f4f8;">MONKEYHUB</div>
    <div style="margin-top: 24px; width: 24px; height: 24px; border: 2.5px solid rgba(255,255,255,0.12); border-top-color: #00e5ff; border-radius: 50%; animation: mhSpin 0.8s linear infinite;"></div>
  </div>

  <script>
    (function() {
      function hideSplash() {
        var s = document.getElementById('app-splash');
        if (s && s.style.opacity !== '0') {
          s.style.opacity = '0';
          setTimeout(function() { if (s && s.parentNode) s.parentNode.removeChild(s); }, 350);
        }
      }
      window.addEventListener('flutter-first-frame', hideSplash);
      // Fallback timer in case event is fired before listener attaches
      setTimeout(hideSplash, 4000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
