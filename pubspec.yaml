name: monkeyhub
description: "MonkeyHub — rooms, friends, secrets that fade."
publish_to: 'none'

version: 1.3.65+1

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Web DOM bindings (js-interop) — used by the web app-badge (tab title +
  # favicon bubble + navigator.setAppBadge). Web-only via conditional import.
  web: ^1.1.1

  google_fonts: ^8.2.0

  # Backend (Convex)
  convex_flutter: ^3.0.1
  # Pin flutter_rust_bridge to the version convex_flutter 3.0.1 was codegen'd
  # against — newer versions trigger a runtime mismatch error.
  flutter_rust_bridge: 2.11.1

  # Reads env.local from the asset bundle at startup so `flutter run` works
  # without --dart-define-from-file. env.local is gitignored.
  flutter_dotenv: ^6.0.1

  # Media: gallery picker, in-app camera, voice recorder, audio + video playback.
  image_picker: ^1.1.2
  # Arbitrary-document picker. Separate from image_picker, which only offers the
  # photo library. Used with `withData: true` — mandatory on web, where there is
  # no path to read back afterwards, and wanted everywhere else because
  # `UploadService.uploadFile` takes bytes.
  # Arbitrary-document picker. Separate from image_picker, which only offers the
  # photo library; same flutter/packages family, so it behaves the same way and
  # hands back the same `XFile`.
  #
  # Chosen over the more popular `file_picker` for a hard reason, not taste:
  # every stable file_picker (≤ 11.x) depends on `win32 ^5.9`, while
  # package_info_plus and share_plus are both on `win32 ^6` — they cannot
  # co-resolve, and pub's suggested way out is dropping file_picker to its 2021
  # 3.x line or taking a 12.0.0-beta. file_selector implements Windows as a
  # native C++ plugin and depends on `win32` not at all, so the conflict simply
  # does not exist.
  file_selector: ^1.1.0
  camera: ^0.12.0+2
  record: ^6.2.1
  just_audio: ^0.10.6
  video_player: ^2.9.2
  http: ^1.2.2
  # Saves images to the system Photos/Gallery (avatar "download", and saving
  # from the shared-content browser).
  gal: ^2.3.0
  # Poster frames for outgoing videos, so the shared-content grid shows the
  # video instead of a play glyph. ANDROID + iOS ONLY — it wraps
  # MediaMetadataRetriever and AVAssetImageGenerator, and there is no web or
  # desktop implementation of either. Videos sent from those platforms (and all
  # history) keep the glyph tile permanently; see `messages.posterStorageId`.
  #
  # Chosen over the `video_thumbnail_plus` fork on adoption: 617 likes and
  # ~164k monthly downloads against 0 and ~565. Its `<3.0.0` SDK bound resolves
  # under pub's Dart 3 leniency for exactly that upper bound.
  video_thumbnail: ^0.5.6
  # JPEG encoding for cropped photos. dart:ui only encodes PNG, and a 1024²
  # photographic PNG is ~2 MB against ~200 KB for JPEG q90. Already resolved
  # transitively at this version; listing it here only promotes it to a direct
  # dependency.
  image: ^4.8.0

  # Disk + memory cache for remote images. `Image.network` has NO persistent
  # cache on mobile (dart:io's HttpClient doesn't implement one), so every cold
  # start re-downloaded every avatar — and Convex serves storage with
  # `cache-control: private, max-age=2592000`, which this honors. See
  # lib/widgets/remote_image.dart for the decode-sizing half of the fix, which
  # is what actually stops the in-session thrashing.
  cached_network_image: ^3.4.1

  # No push-notification SDK. The app registers with APNs and FCM itself
  # (ios/Runner/AppDelegate.swift, android/.../CallFcmService.kt) and the Convex
  # backend talks to Apple, Google and the browsers' push services directly —
  # see backend/convex/push.ts. Unlimited volume, no vendor, and the payloads
  # are ours to shape.

  # Native call UI: iOS CallKit + Android Telecom/ConnectionService. Lets the
  # OS ring a full-screen incoming-call experience even when the app is
  # backgrounded or killed (when paired with a VoIP push wake-up).
  # PINNED: AppDelegate.swift (saveEndCall reason codes) and CallFcmService.kt
  # (FlutterCallkitIncomingPlugin.getInstance / showIncomingNotification) call
  # plugin internals — re-verify both before any bump.
  # Verified for 3.1.3: sharedInstance, saveEndCall(uuid, reason) with 4 still
  # mapping to .answeredElsewhere, Data(id:nameCaller:handle:type:),
  # getInstance/hasInstance, showIncomingNotification(Data), endCall(Data) and
  # Kotlin `data class Data(Map)` are all unchanged. What 3.x DOES change is
  # behaviour, not signatures: 3.1.0 added a self-managed Telecom
  # ConnectionService on Android and reworked ringtone/foreground-service
  # handling. Neither shows up in `flutter analyze` — they show up as a phone
  # that does not ring, so device-test both platforms after touching this.
  flutter_callkit_incoming: 3.1.3

  # FCM for Android VoIP-style data pushes is wired natively in MainActivity.kt
  # via the `monkeyhub/fcm` method channel — no Flutter Firebase plugin needed
  # (keeps iOS bundle free of unused FirebaseCore/Installations frameworks).
  # The native Android Firebase SDK is pulled in by android/app/build.gradle.kts.

  # WebRTC for 1:1 + mesh group voice/video calls. Signaling rides on Convex;
  # STUN is Google's public servers, TURN is self-hosted coturn.
  # PINNED to 1.4.1: 1.5.x hard-switches iOS to the AVAudioEngine audio
  # device module with no opt-out and no CallKit coordination, which kills
  # call audio on the CallKit path (upstream flutter-webrtc #2111, #1996,
  # #2095, #2098 — confirmed workaround is this downgrade). Re-evaluate the
  # bump only when upstream ships CallKit handoff for the new ADM, and
  # device-test 1:1 VIDEO call audio both ways before shipping it.
  flutter_webrtc: 1.4.1

  # Auth / crypto
  crypto: ^3.0.3
  flutter_secure_storage: ^10.3.1

  # Social sign-in. NATIVE flows only, on purpose: the native SDKs hand back an
  # ID token the backend verifies itself (`backend/convex/idToken.ts`), so there
  # is no redirect URI, no Apple Services ID and no domain-bound OAuth config
  # anywhere — which is what keeps a later move off the Oracle box free.
  #
  # Apple is iOS/macOS only here. Sign in with Apple ON ANDROID would need the
  # web flow (Services ID + an HTTPS return URL that bounces back into the app),
  # which is the one thing that would pin us to a domain. Android gets Google.
  #
  # Offering Google WITHOUT Apple on iOS would fail App Store guideline 4.8 —
  # this app currently qualifies for the "own account setup" exemption, and
  # adding a third-party login destroys it. Ship both or neither on iOS.
  sign_in_with_apple: ^8.1.0
  google_sign_in: ^7.2.0

  # Solely to render Google's official "G" inside the Google sign-in button.
  # Their branding guidelines forbid recolouring, rescaling or redrawing the
  # mark, so it ships as Google's own vector (branding/google_g.svg) rather
  # than as one of this app's hand-painted CustomPainter icons. Nothing else
  # in the app uses SVG.
  flutter_svg: ^2.2.1

  # Child-device pairing. The parent's phone renders a short-lived code as a
  # QR (qr_flutter); the child's phone either scans it (mobile_scanner) or the
  # six digits get typed in by hand.
  qr_flutter: ^4.1.0
  # 7.x replaced Google ML Kit with Apple's Vision framework on iOS/macOS.
  # ML Kit ships no arm64-simulator slices, which made the app unbuildable
  # for Apple Silicon simulators (iOS 26+ sims are arm64-only, no Rosetta).
  mobile_scanner: ^7.4.0

  # Storage / paths
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Reads pubspec.yaml at runtime so Settings can show "v$version".
  package_info_plus: ^10.2.1
  emoji_picker_flutter: ^4.5.3

  # URL handling: detection in text, opening externally, and the native system
  # browser for tapped links (SFSafariViewController / Chrome Custom Tabs).
  url_launcher: ^6.3.0
  flutter_custom_tabs: ^2.6.0
  # OG-tag parser for link previews.
  html: ^0.15.4
  # Hands a received document to the OS: the system share sheet natively, and on
  # web a fall back to clicking an `<a download="…">` anchor. That fallback is
  # why `DocumentSaver` needs no conditional import of its own.
  #
  share_plus: ^13.3.0

  # Splash-screen plugin. MUST live in `dependencies`, not dev_dependencies:
  # its Android platform class ends up referenced in the generated plugin
  # registrant, but Flutter's release Gradle builds EXCLUDE dev-dependency
  # plugin modules — the mismatch fails `assembleRelease` with
  # "package net.jonhanson.flutter_native_splash does not exist".
  # (`dart run flutter_native_splash:create` still works from here.)
  flutter_native_splash: ^2.4.1

  # OS network-interface changes, used only to wake the reconnect loop early
  # (see ConnectionHealth). Deliberately NOT treated as reachability truth: it
  # reports interfaces, so it reads "connected" behind a captive portal or a
  # dead VPN. Android's ACCESS_NETWORK_STATE ships in the plugin's own manifest
  # and merges automatically; no iOS permission.
  connectivity_plus: ^7.3.1

  # Accelerometer, used for exactly one thing: shake-to-report (see
  # ShakeDetector). The subscription is opened once at app start and is a
  # low-rate sensor stream, not a wake lock — but it IS always on, so the
  # detector is deliberately strict about what counts as a shake and every
  # trigger goes through a confirm sheet rather than straight into a form.
  # Needs no permission on either platform.
  sensors_plus: ^7.0.0
  flutter_localizations:
    sdk: flutter

dependency_overrides:
  # record 5.x ships with a stale record_linux that doesn't implement the
  # newer platform-interface contract; pin to the fixed line.
  record_linux: ^1.3.0

  # convex_flutter 3.0.1 with five fixes to its WEB client, all of them in
  # `lib/src/impl/convex_client_web.dart` and each marked `monkeyhub patch`.
  # Nothing else is changed, so `git diff` against the pub version is the whole
  # story. See third_party/convex_flutter/PATCHES.md.
  #
  # Upstream's socket handling could not converge after a single server-side
  # hangup: closing a socket scheduled a reconnect that closed the next one,
  # superseded sockets were left open and still routing messages by an id space
  # that restarts per connection, and a reconnected client never re-registered
  # its query set — so it reported `connected` while receiving nothing.
  #
  # When bumping convex_flutter, re-apply these against the new version (or drop
  # them if upstream has fixed it) — pub will otherwise silently take the fixes
  # away, and the symptom is a chat that quietly stops updating.
  convex_flutter:
    path: third_party/convex_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Transitively present via flutter_secure_storage; declared explicitly because
  # `test/device_identity_test.dart` implements `FlutterSecureStoragePlatform`
  # directly. The package's own in-memory double ignores the `options` map, and
  # the accessibility class inside it is the entire subject of that test.
  flutter_secure_storage_platform_interface: ^2.0.1

  # Transitively present via flutter_test; declared explicitly because
  # `test/username_rename_test.dart` calls `fakeAsync` directly. The username
  # availability check is a debounce and a race guard — both are statements
  # about time, and asserting them by really sleeping would put seconds into a
  # suite whose whole value is that it does not have any.
  fake_async: ^1.3.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Branding generator — run with:
  #   dart run flutter_launcher_icons
  # (flutter_native_splash lives in `dependencies` — see note there.)
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "branding/logo.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  # Adaptive icon for Android 8+: monkey on a dark backdrop matching the
  # branding gradient.
  adaptive_icon_background: "#0E0E10"
  adaptive_icon_foreground: "branding/logo.png"
  web:
    generate: true
    image_path: "branding/logo.png"
    background_color: "#0E0E10"
    theme_color: "#0E0E10"
  macos:
    generate: true
    image_path: "branding/logo.png"

flutter_native_splash:
  color: "#0E0E10"
  image: "branding/logo.png"
  android_12:
    image: "branding/logo.png"
    color: "#0E0E10"
  ios: true
  android: true
  web: false  # web splash isn't needed for a chat app

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generates lib/l10n/generated/app_localizations.dart from lib/l10n/*.arb
  # on every `flutter pub get` / `flutter run` (config in l10n.yaml).
  generate: true

  # Swift Package Manager stays off for this project. Flutter 3.44 turns it on
  # by default and tries to migrate ios/Runner.xcodeproj on every build.
  #
  # The two reasons this used to be impossible were both about the OneSignal
  # SDK — an exact-version Package.swift pin that failed on a stale SwiftPM
  # mirror, and a double link that dragged OneSignalLocation back into the
  # binary. Both are gone with the SDK.
  #
  # What still blocks it: ios/Podfile's post_install loads
  # tool/setup_ios_alternate_icons.rb, which is what registers every
  # ios/Runner/AlternateIcons/*.png as a Runner resource — the entire
  # alternate-launcher-icon feature depends on that hook, and SwiftPM has no
  # equivalent. flutter_webrtc and GoogleMLKit keep CocoaPods in the build
  # regardless, so there is nothing to gain by migrating today.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # env.local is gitignored. Copy env.example → env.local before running.
    - env.local
    - branding/logo.png
    # Google's official "G", for the Google sign-in button. Their artwork,
    # unmodified — see the file's own header before touching it.
    - branding/google_g.svg
    # Monkey Collection — curated alternate-icon set. See
    # lib/widgets/monkey_collection.dart.
    - branding/monkey/monkey-hmm.png
    - branding/monkey/monkey-fields.png
    - branding/monkey/monkey-hiking.png
    - branding/monkey/monkey-astronaut.png
    # EVERY typeface the themes use, bundled. The google_fonts package looks up
    # <Family>-<Variant>.ttf in declared asset paths and prefers a bundled file
    # over a network fetch; `GoogleFonts.config.allowRuntimeFetching = false` in
    # main.dart then makes that a hard guarantee rather than a preference.
    #
    # WHY, beyond offline launcher-icon generation (the original reason four of
    # these were here): left to fetch at runtime, the package contacts Google's
    # font CDN on launch and hands them every user's IP address. In a family
    # messaging app that is a third-party data flow we neither need nor want to
    # disclose, and it is the sort of thing the Kids-category rules bar outright.
    #
    # Six of the eleven families ship only as VARIABLE fonts upstream, so those
    # variants are static instances cut with fontTools at the exact weights the
    # themes ask for. All are subset to Latin + Latin Extended — Turkish
    # (ı İ ş ğ ç ö ü) is verified present in all 37 files. Re-cutting them means
    # instancing from google/fonts and subsetting again; do not hand-edit.
    #
    # Note what is NOT here: Google Sans, which is declared under `fonts:`
    # below rather than resolved by the package. See the comment there.
    - assets/google_fonts/

    # Alert sounds — incoming-call ringtone (looped) + new-message ping. Used
    # on web/desktop where there is no native OS ringer. See lib/audio/.
    - assets/audio/ringtone.mp3
    - assets/audio/ping.mp3

  # The only hand-declared font in the app, and the only one no theme uses.
  #
  # Google Sans Medium is the typeface the Sign in with Google branding
  # guidelines specify for that button, at 14/20. It is declared here rather
  # than dropped into assets/google_fonts/ for two reasons: the google_fonts
  # package resolves families from its own bundled manifest and Google Sans was
  # only added to Google Fonts recently, so a lookup would miss and fall back to
  # the system font SILENTLY — the exact failure this button must not have; and
  # a `fonts:` declaration registers the family with the engine outright, which
  # is checkable in a test.
  #
  # OFL, despite the name — the shipped binary carries
  # "Copyright 2025 The Google Sans Project Authors
  # (github.com/googlefonts/googlesans)" and openfontlicense.org.
  #
  # Cut from the fonts.gstatic.com wght@500 static with fontTools, subset to
  # Latin + Latin Extended (as with the assets/google_fonts/ set) plus every
  # character the button's twelve localized labels use. That covers eight of
  # the twelve outright, including Devanagari; ar/ja/ko/zh fall through to the
  # platform font for their scripts, which is what Google's own Android button
  # does. Re-cut it if a locale is added — see the widget's doc comment.
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
