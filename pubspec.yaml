name: monkeyhub
description: "MonkeyHub — rooms, friends, secrets that fade."
publish_to: 'none'

version: 1.3.11+1

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  google_fonts: ^6.2.1

  # Backend (Convex)
  convex_flutter: ^3.0.1
  # Pin flutter_rust_bridge to the version convex_flutter 3.0.1 was codegen'd
  # against — newer versions trigger a runtime mismatch error.
  flutter_rust_bridge: 2.11.1

  # Reads env.local from the asset bundle at startup so `flutter run` works
  # without --dart-define-from-file. env.local is gitignored.
  flutter_dotenv: ^5.2.1

  # Media: gallery picker, in-app camera, voice recorder, audio + video playback.
  image_picker: ^1.1.2
  camera: ^0.11.0
  record: ^5.1.2
  just_audio: ^0.9.42
  video_player: ^2.9.2
  http: ^1.2.2

  # Push notifications (OneSignal v5 SDK).
  onesignal_flutter: ^5.2.9

  # Auth / crypto
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2

  # Storage / paths
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Reads pubspec.yaml at runtime so Settings can show "v$version".
  package_info_plus: ^8.0.0

dependency_overrides:
  # record 5.x ships with a stale record_linux that doesn't implement the
  # newer platform-interface contract; pin to the fixed line.
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Branding generators — run with:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  image_path: "branding/logo.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  # Adaptive icon for Android 8+: monkey on a dark backdrop matching the
  # branding gradient.
  adaptive_icon_background: "#0E0E10"
  adaptive_icon_foreground: "branding/logo.png"
  web:
    generate: true
    image_path: "branding/logo.png"
    background_color: "#0E0E10"
    theme_color: "#0E0E10"
  macos:
    generate: true
    image_path: "branding/logo.png"

flutter_native_splash:
  color: "#0E0E10"
  image: "branding/logo.png"
  android_12:
    image: "branding/logo.png"
    color: "#0E0E10"
  ios: true
  android: true
  web: false  # web splash isn't needed for a chat app

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # env.local is gitignored. Copy env.example → env.local before running.
    - env.local
    - branding/logo.png
    # Monkey Collection — curated alternate-icon set. See
    # lib/widgets/monkey_collection.dart.
    - branding/monkey/monkey-hmm.png
    - branding/monkey/monkey-fields.png
    - branding/monkey/monkey-hiking.png
    - branding/monkey/monkey-astronaut.png
    # Bundled Google Fonts used by 4 theme brandMarks. The google_fonts
    # package looks up <Family>-<Variant>.ttf in declared asset paths and
    # prefers them over a network fetch — so launcher-icon generation works
    # offline AND launcher icons render with the real typeface (not a
    # Material fallback).
    - assets/google_fonts/Anta-Regular.ttf
    - assets/google_fonts/JetBrainsMono-Regular.ttf
    - assets/google_fonts/Spectral-Regular.ttf
    - assets/google_fonts/Audiowide-Regular.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
