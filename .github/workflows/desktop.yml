# Windows + Linux release builds, driven by ./deploy.sh --windows / --linux.
#
# Flutter cannot cross-compile desktop targets, so the Mac that runs deploy.sh
# cannot build either of these itself. deploy.sh pushes a tag instead:
#
#   desktop-build/<platforms>/<version>/<epoch>
#   e.g. desktop-build/windows+linux/1.3.90/1760000000
#
# waits for this run, downloads the artifacts into build/ and does the store /
# VM upload locally, exactly like every other platform. The tag is deleted again
# once the run is done; it exists only to point the run at a commit.
#
# A tag rather than workflow_dispatch: dispatch only works for workflows that
# exist on the default branch (main), and releases ship from dev.
#
# The version comes from the tag, not pubspec.yaml: deploy.sh bumps pubspec
# locally and commits it only once everything has shipped, so the pushed
# commit still carries the previous number.
#
# env.local (runtime config, gitignored, bundled as an asset) comes from the
# ENV_LOCAL secret, which deploy.sh refreshes from the local file before every
# tag — so CI always bundles what this Mac would have.
name: desktop

on:
  push:
    tags: ['desktop-build/**']

env:
  # Keep in step with the Flutter this Mac builds iOS/Android with — deploy.sh
  # warns when they drift.
  FLUTTER_VERSION: '3.47.0'

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.parse.outputs.platforms }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          IFS=/ read -r _ platforms version _ <<< "$GITHUB_REF_NAME"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $platforms at $version"

  windows:
    needs: meta
    if: contains(needs.meta.outputs.platforms, 'windows')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: env.local
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
        run: printf '%s\n' "$ENV_LOCAL" > env.local
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # flutter_webrtc 1.4.x downloads libwebrtc.zip at configure time and
      # extracts it through windows/flutter/ephemeral/.plugin_symlinks, which
      # CMake on Windows refuses ("Cannot extract through symlink"). Unpacking
      # it into the package's real directory first makes its CMake skip both
      # steps. 1.5.x resolves the symlink itself; there the URL pattern below
      # stops matching and this is a no-op.
      - name: Pre-extract libwebrtc
        shell: pwsh
        run: |
          $cfg = Get-Content .dart_tool/package_config.json | ConvertFrom-Json
          $pkg = $cfg.packages | Where-Object name -eq 'flutter_webrtc'
          # A vendored (path) package has a rootUri relative to .dart_tool/.
          $root = if ($pkg.rootUri -match '^file:') { [System.Uri]::new($pkg.rootUri).LocalPath } else { [System.IO.Path]::GetFullPath((Join-Path '.dart_tool' $pkg.rootUri)) }
          $tp = Join-Path $root 'third_party'
          $m = Select-String -Path (Join-Path $tp 'CMakeLists.txt') -Pattern 'https://\S+/libwebrtc\.zip'
          if ($m -and -not (Test-Path (Join-Path $tp 'libwebrtc'))) {
            $zip = Join-Path $tp 'downloads/libwebrtc.zip'
            New-Item -ItemType Directory -Force (Split-Path $zip) | Out-Null
            Invoke-WebRequest $m.Matches[0].Value -OutFile $zip
            Expand-Archive $zip -DestinationPath $tp -Force
            Write-Host "libwebrtc unpacked into $tp"
          }
      - name: flutter build windows
        run: >
          flutter build windows --release
          --build-name ${{ needs.meta.outputs.version }} --build-number 1
          --dart-define=MH_CHANNEL=windows
      # Unsigned on purpose (--store): Partner Center signs the package with
      # the Store's certificate. Global activation keeps msix out of
      # pubspec.lock; it reads msix_config from pubspec.yaml in the cwd.
      - name: MSIX
        run: |
          dart pub global activate msix 3.18.0
          dart pub global run msix:create --store --build-windows false \
            --version ${{ needs.meta.outputs.version }}.0 \
            --output-path build/msix --output-name MonkeyHub
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: build/msix/MonkeyHub.msix
          if-no-files-found: error
          retention-days: 2

  linux:
    needs: meta
    if: contains(needs.meta.outputs.platforms, 'linux')
    # 22.04, not latest: the binary links against the build box's glibc, and
    # the older one runs on more distros (Arch is never the problem; Debian
    # stable and Mint are).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: env.local
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
        run: printf '%s\n' "$ENV_LOCAL" > env.local
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: flutter build linux
        run: >
          flutter build linux --release
          --build-name ${{ needs.meta.outputs.version }} --build-number 1
          --dart-define=MH_CHANNEL=linux
      # Nobody on the team runs Linux, so this is the only proof the bundle
      # launches before it goes on the downloads page and the AUR: no missing
      # shared libraries, and still alive after 20s on a virtual display
      # (timeout's 124 = we killed it = it didn't crash on its own).
      - name: Launch smoke test
        run: |
          sudo apt-get install -y xvfb
          b=build/linux/x64/release/bundle
          if ldd "$b/monkeyhub" "$b"/lib/*.so | grep 'not found'; then exit 1; fi
          set +e
          timeout 20 xvfb-run -a "$b/monkeyhub" > smoke.log 2>&1
          rc=$?
          tail -n 40 smoke.log
          [ $rc -eq 124 ] || { echo "monkeyhub exited with $rc before 20s"; exit 1; }
      # One self-contained folder: the bundle plus the launcher entry and icon,
      # which the AUR package installs into /usr/share and a tarball user can
      # copy there by hand.
      - name: Tarball
        run: |
          v=${{ needs.meta.outputs.version }}
          mkdir -p stage/monkeyhub
          cp -r build/linux/x64/release/bundle/. stage/monkeyhub/
          cp linux/packaging/monkeyhub.desktop linux/packaging/monkeyhub.png stage/monkeyhub/
          tar -czf "monkeyhub-linux-x64-$v.tar.gz" -C stage monkeyhub
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: monkeyhub-linux-x64-*.tar.gz
          if-no-files-found: error
          retention-days: 2
