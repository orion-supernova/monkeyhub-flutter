# termio-tunnel — MonkeyHub's API and its Convex dashboard.
#
# Installed on the box at /opt/stacks/edge/cloudflared/termio.yml by
# `migrate-to-ampere.sh prepare`. The credentials JSON named below is copied
# off the old VPS by the same step and is NOT in git — it is a secret.
#
# The services are container names on the shared `edge` Docker network, not
# 127.0.0.1 ports as on the old VPS. Same effect, one fewer indirection, and it
# keeps working if the loopback port bindings are ever dropped.
#
# protocol: http2 (TCP), not the default QUIC (UDP). Every app's Convex
# websocket rides one of this tunnel's four edge connections, and on QUIC
# those kept dying ("datagram manager error: timeout: no recent network
# activity", ~20 in the week to 2026-11-02), each one cutting every socket on
# it: a quarter of the users online, reconnecting at once.
tunnel: e970c8dc-30e5-4b6e-a3c7-d569b816ebd1
protocol: http2
credentials-file: /etc/cloudflared/e970c8dc-30e5-4b6e-a3c7-d569b816ebd1.json

ingress:
  - hostname: termio-api.walhallaa.com
    service: http://monkeyhub-convex-backend:3210
  - hostname: termio-dashboard.walhallaa.com
    service: http://monkeyhub-convex-dashboard:6791
  - service: http_status:404
