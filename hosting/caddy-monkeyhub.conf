# MonkeyHub — the :8081 site block, served through cloudflared
# (monkeyhub.walhallaa.com), so plain HTTP on a local port; Cloudflare
# terminates TLS at the edge.
#
#   /            landing page          /srv/monkeyhub/site
#   /downloads/  every platform        /srv/monkeyhub/downloads
#   /web/        Flutter web app       /srv/monkeyhub/web
#   /download    301 → /downloads/     (the link that was shared publicly)
#
# THIS FILE IS THE SOURCE OF TRUTH. Install it with `./deploy.sh --infra`,
# which copies it to /etc/caddy/monkeyhub.conf, runs `caddy validate` against
# the whole config, and only then reloads. /etc/caddy/Caddyfile pulls it in
# with a single `import monkeyhub.conf` line.
#
# Why the app lives at /web/ and not web.monkeyhub.walhallaa.com: Cloudflare's
# free Universal SSL cert on this zone covers `walhallaa.com` and
# `*.walhallaa.com` — one level only. A two-level name fails the handshake
# outright (TLS alert 40) and would need Advanced Certificate Manager. Staying
# on one origin also keeps web sessions and push subscriptions alive.

:8081 {
	@compressible not path *.aab *.dmg *.exe *.msix *.AppImage *.zip *.tar.gz
	encode @compressible gzip

	# /download was the public share link AND is stored server-side as the
	# android-apk channel's updateUrl, so already-installed APKs keep asking
	# for it until they next check in. It has to keep answering, forever.
	# That is now MORE load-bearing, not less: the APK is retired, and this
	# redirect is the whole route by which a sideloaded copy reaches the page
	# explaining how to move to Play.
	redir /download /downloads/ permanent

	redir /downloads /downloads/
	redir /web /web/

	# handle_path strips the prefix, so {http.request.uri.path} below is
	# whatever followed /download — including the old versioned APK links,
	# which now land on the migration page rather than a 404.
	handle_path /download/* {
		redir * /downloads{http.request.uri.path} permanent
	}

	# No .apk Content-Type rule any more — nothing here is an APK. The binary
	# handling above is kept for the desktop artifacts this directory is now
	# waiting on.
	handle_path /downloads/* {
		root * /srv/monkeyhub/downloads
		header Cache-Control "no-cache"
		file_server
	}

	# The app's own service-worker script, given its own rule before the
	# catch-all below (handle blocks are mutually exclusive, first match wins).
	# Browsers already bypass the HTTP cache when they re-check a worker script,
	# so it cannot go stale, and no-store on a worker script is a needless
	# gamble on how strictly a given browser reads it.
	handle /web/flutter_service_worker.js {
		root * /srv/monkeyhub/web
		rewrite * /flutter_service_worker.js
		header Cache-Control "no-cache"
		file_server
	}

	# no-store, and it has to be no-store rather than no-cache.
	#
	# Flutter reuses its output filenames across builds — main.dart.js keeps its
	# name and changes its bytes — so nothing here is safely cacheable by URL.
	# no-cache is not enough: this zone has a 4 h Browser Cache TTL and
	# Cloudflare caches by extension, so a no-cache .js came back to the client
	# rewritten as `max-age=14400`. That is four hours of a deploy being
	# invisible, and worse, a window where a fresh index.html pairs with a stale
	# main.dart.js — which would make the app's own update prompt lie, telling
	# someone to reload into the build they already have. no-store is honoured
	# end to end (cf-cache-status: BYPASS, header intact).
	#
	# There is no service-worker cache to soften this: `flutter build web` ships
	# Flutter's self-unregistering worker stub, so every visit is a real fetch.
	# It is a cheap one, though — measure the wire, not the disk: main.dart.js
	# is 6.4 MB on disk but 1.8 MB gzipped, and a whole cold load is ~1.9 MB.
	# That is a small price for never serving a stale build, which is why the
	# obvious optimisation (a Cloudflare purge on deploy, allowing a long
	# max-age instead) is deliberately NOT wired up: it would buy back under
	# 2 MB per visit in exchange for a zone-scoped API token to store and
	# rotate. DEPLOY.md sketches it if the audience ever grows.
	#
	# Binaries under /downloads/ deliberately do NOT do this — an installer of a
	# hundred-odd MB should stay cacheable and resumable, and staleness there is
	# already solved by giving every release its own filename.
	# Fonts and the engine come from the SDK, not from our source: they move on a
	# Flutter or package bump, never on an ordinary deploy, and a day of
	# staleness in a glyph file harms nobody.
	#
	# Worth almost nothing today — the tree-shaken icon fonts total ~23 KB of a
	# 1.9 MB load. It earns its keep on canvaskit/: this app's renderer does not
	# fetch it at all right now, but if that changes it is several MB, and this
	# is the rule that stops it being re-downloaded on every single visit.
	#
	# Its own handle block rather than a matcher inside the one below, because
	# two `header` directives in one block do NOT resolve in written order — the
	# blanket no-store won and the fonts stayed uncached. Separate handle blocks
	# are mutually exclusive and first-match-wins, which is unambiguous.
	@durable path /web/assets/fonts/* /web/assets/packages/*/assets/* /web/canvaskit/*
	handle @durable {
		root * /srv/monkeyhub/web
		uri strip_prefix /web
		header Cache-Control "public, max-age=86400"
		file_server
	}

	handle_path /web/* {
		root * /srv/monkeyhub/web
		header Cache-Control "no-store"
		try_files {path} /index.html
		file_server
	}

	# No root-scope service worker any more. The push worker
	# (web/mh-push-sw.js) is served from /web/ like everything else in the app
	# and registers itself at scope /web/push/ — the previous vendor's SDK was
	# the only thing that ever needed an origin-root file, because it hardcoded
	# the path.

	# The self-hosted webfonts, shared by the landing page AND the downloads
	# page — which is why they sit at the origin root rather than under either
	# one. /downloads/ is a handle_path block that strips its prefix, so a
	# relative font URL there would resolve inside the downloads directory;
	# both pages therefore reference /fonts/… absolutely and land here.
	#
	# Cacheable, unlike everything else served out of the site root. These are
	# static instances cut from upstream sources at build time (see
	# hosting/static/fonts/): they change only when someone regenerates them,
	# never on an ordinary deploy. The blanket no-cache below would otherwise
	# cost four conditional requests on every single page view for bytes that
	# are identical every time.
	#
	# Its own handle block rather than a matcher inside the one below, for the
	# same reason the /web/ font rule has one: two `header` directives in a
	# single block do not resolve in written order.
	handle /fonts/* {
		root * /srv/monkeyhub/site
		header Cache-Control "public, max-age=86400"
		file_server
	}

	# Landing page. Also serves /flutter_service_worker.js, which is now a
	# self-unregistering shim replacing the real worker from when the app was
	# served here — see hosting/static/flutter_service_worker.js.
	handle {
		root * /srv/monkeyhub/site
		header Cache-Control "no-cache"
		file_server
	}
}
